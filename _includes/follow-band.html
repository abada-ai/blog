<section class="section follow-section" aria-labelledby="follow-title">
  <div class="wrap">
    <div class="follow-band">
      <div>
        <h2 id="follow-title">Never miss a post.</h2>
        <p>Every new post is shared on LinkedIn the day it goes live. {{ site.cadence }}</p>
      </div>
      <div class="btn-row">
        <a class="btn btn-green btn-lg" href="{{ site.linkedin_url }}">Follow on LinkedIn</a>
        <a class="btn btn-ghost btn-lg" href="{{ site.contact_url }}?about=topic&amp;from={{ page.url | absolute_url | cgi_escape }}">Suggest a topic</a>
      </div>
    </div>
  </div>
</section>
