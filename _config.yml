# =============================================================
#  The ABADA AI Briefing: site settings
#
#  Change the text inside the quotes and keep the quotes.
#  After you commit a change, GitHub rebuilds the blog in 1-2 minutes.
# =============================================================

title: "The ABADA AI Briefing"
tagline: "The AI briefing for leaders who turn AI into results."
description: "Less hype, more impact: AI strategy, transformation and automation that streamline processes, cut costs and free your people for higher-value work. Enterprise know-how, sized for small companies and community organizations. Plus the latest from OpenAI, Anthropic, Google and Meta, explained by an automation practitioner."

# The lines under the big title on the blog home page (one per line)
intro:
  - "Less hype, more impact: AI strategy, transformation and automation that streamline processes, cut costs and free your people for higher-value work."
  - "Enterprise know-how, sized for small companies and community organizations."
  - "Plus the latest from OpenAI, Anthropic, Google and Meta, explained by an automation practitioner."

# Who writes the blog (shown on every post)
author:
  name: "Monal Shah"
  role: "Founder, ABADA.AI"
  initials: "MS"
  bio: "Founder of ABADA.AI. Writes about agentic AI, process discovery and AI strategy for leaders of small companies and community organizations."

# Links used across the blog
linkedin_url: "https://www.linkedin.com/in/YOUR-PROFILE"
home_url: "https://abada.ai"
contact_email: "hello@abada.ai"
# Contact links open this web form (on abada.ai) instead of an email app.
contact_url: "https://abada.ai/contact.html"
process_check_url: "https://abada.ai/process-check.html"
cadence: "New posts monthly to start, then twice a month."

# Pre-launch switch
#   true  = the blog is online but asks search engines not to list it
#   false = normal, public, searchable blog (set this on launch day)
preview_mode: true

# The picture shown when a page is shared on LinkedIn or X is set in
# "defaults" below (og-default.png). A post can use its own picture
# with an "image:" line in its front matter.
logo: /apple-touch-icon.png

# -------------------------------------------------------------
#  Technical settings: leave everything below as it is
# -------------------------------------------------------------
url: "https://blog.abada.ai"
baseurl: ""
lang: en
timezone: America/Chicago
permalink: /:year/:month/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  topics:
    output: true
    permalink: /topics/:name/
twitter:
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
exclude:
  - README.md
  - _templates/
